name: check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm test
      - if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/check-commits.mjs "origin/${{ github.base_ref }}..HEAD"
